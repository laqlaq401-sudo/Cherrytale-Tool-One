[pytest]
# ------------------------------------------------------------
# 为什么必须写 testpaths？
# 工作区里躺着 Cherrytale IL2CPP/ 和 Cherrytale Asset/ 共 6800+ 个素材文件。
# 若不限定收集范围，pytest 的“收集阶段”会去扫描素材目录，
# 既拖慢速度，也可能因为遇到奇怪的文件而抛出难以理解的错误。
# ------------------------------------------------------------
testpaths = tests

# 把项目根目录加入导入路径，这样直接敲 `pytest` 也能 import 到 client/crypto/models/tasks
pythonpath = .

# 测试文件与用例的命名约定（保持 Python 社区默认风格，便于阅读理解）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra : 结尾汇总显示非通过用例的原因；-q : 输出精简，适合初学者看关键信息
addopts = -ra -q

# 自定义标记注册。
# 注册过的标记才不会触发 PytestUnknownMarkWarning —— 也就是让 pytest
# 明确知道「哪些用例会真的联网」，方便用 -m "not network" 一次性排除。
markers =
    network: 会发起真实网络请求的用例（默认跳过，需要设 CHERRYTALE_RUN_NETWORK_TESTS=1）
